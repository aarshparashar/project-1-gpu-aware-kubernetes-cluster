apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-aware-control-plane
  namespace: default
  labels:
    app: control-plane
spec:
  replicas: 2
  selector:
    matchLabels:
      app: control-plane
  template:
    metadata:
      labels:
        app: control-plane
    spec:
      containers:
      - name: control-plane
        image: <AWS_ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/gpu-aware-control-plane:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: control-plane-service
  namespace: default
spec:
  selector:
    app: control-plane
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: LoadBalancer
