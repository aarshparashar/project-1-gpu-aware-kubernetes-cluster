name: Build and Push to ECR

on:
  push:
    branches:
      - main
    paths:
      - 'control_plane/**'
      - 'scheduler/**'
      - 'worker/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build Control Plane
        run: |
          CGO_ENABLED=0 GOOS=linux go build -o ./build/control-plane ./control_plane/main.go
      
